name: format-issue

on:
  issues:
    types: [opened]

jobs:
  format-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Format and label issue
        uses: actions/github-script@v7
        with:
          script-file: .github/scripts/format-issue.js
